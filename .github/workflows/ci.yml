name: Pixel & Pen CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    frontend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./frontend

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install Dependencies
              run: npm ci

            - name: Run Lint
              run: npm run lint

            - name: Build Frontend
              run: npm run build

    backend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./backend
        
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          
          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 20
                cache: "npm"
                cache-dependency-path: backend/package-lock.json
                
          - name: Install Dependencies
            run: npm ci